    <script>

        /* =======================================
           CONTRACT
        ======================================== */

        const CONTRACT_ADDRESS =
            "0x8edfeee0396c0CB7869d260bC237F6f25233Aac2";


        /* =======================================
           LORE DATA
        ======================================== */

        const loreData = [

            {
                chapter: "LORE 01 · THE ORIGIN",
                text: "You can't spell XMIUM without X."
            },

            {
                chapter: "LORE 02 · THE X",
                text: "XMIUM — because premium was never enough."
            },

            {
                chapter: "LORE 03 · THE UPGRADE",
                text: "Premium got an X upgrade. Welcome to XMIUM."
            },

            {
                chapter: "LORE 04 · THE ERA",
                text: "Premium is old. XMIUM is next."
            },

            {
                chapter: "LORE 05 · THE ATTITUDE",
                text: "Forget Premium. Go XMIUM."
            },

            {
                chapter: "LORE 06 · THE DIFFERENCE",
                text: "Not Premium. XMIUM."
            },

            {
                chapter: "LORE 07 · THE QUESTION",
                text: "Why be premium when you can be XMIUM?"
            },

            {
                chapter: "LORE 08 · THE SOUND",
                text: "XMIUM. Sounds expensive. Costs nothing to say."
            },

            {
                chapter: "LORE 09 · THE IDENTITY",
                text: "The X stands for everything."
            },

            {
                chapter: "LORE 10 · THE SIGNAL",
                text: "Bro, are you XMIUM?"
            },

            {
                chapter: "LORE 11 · THE STATEMENT",
                text: "That's not premium. That's XMIUM."
            },

            {
                chapter: "LORE 12 · BEYOND",
                text: "XMIUM — Beyond Premium."
            },

            {
                chapter: "LORE 13 · THE WELCOME",
                text: "Welcome to the XMIUM era."
            },

            {
                chapter: "LORE 14 · THE UPGRADE",
                text: "XMIUM — Premium got an X upgrade."
            }

        ];


        /* =======================================
           ELEMENTS
        ======================================== */

        const loreText =
            document.getElementById("loreText");

        const loreChapter =
            document.getElementById("loreChapter");

        const loreButtons =
            document.querySelectorAll(".lore-btn");

        const contractButton =
            document.getElementById("contractButton");

        const contractText =
            document.getElementById("contractText");

        const copyStatus =
            document.getElementById("copyStatus");


        /* =======================================
           TYPING ENGINE
        ======================================== */

        let typingTimer = null;

        let typingSession = 0;


        function showLore(index) {

            const lore = loreData[index];

            if (!lore) return;


            /*
             * Stop previous typing immediately.
             */

            typingSession++;

            const currentSession =
                typingSession;

            clearTimeout(typingTimer);


            /*
             * Update chapter.
             */

            loreChapter.textContent =
                lore.chapter;


            /*
             * Reset text.
             */

            loreText.textContent = "";


            /*
             * Update active button.
             */

            loreButtons.forEach((button) => {

                button.classList.remove("active");

            });

            loreButtons[index]
                .classList.add("active");


            /*
             * Respect reduced-motion.
             */

            const reduceMotion =
                window.matchMedia(
                    "(prefers-reduced-motion: reduce)"
                ).matches;


            if (reduceMotion) {

                loreText.textContent =
                    lore.text;

                return;

            }


            /*
             * Type character by character.
             */

            let position = 0;

            const speed = 34;


            function typeNextCharacter() {

                if (
                    currentSession !==
                    typingSession
                ) {
                    return;
                }


                if (
                    position <
                    lore.text.length
                ) {

                    loreText.textContent +=
                        lore.text.charAt(position);

                    position++;

                    typingTimer =
                        setTimeout(
                            typeNextCharacter,
                            speed
                        );

                }

            }


            typeNextCharacter();

        }


        /* =======================================
           LORE BUTTON EVENTS
        ======================================== */

        loreButtons.forEach((button) => {

            button.addEventListener(
                "click",
                () => {

                    const index =
                        Number(
                            button.dataset.lore
                        );

                    showLore(index);

                }
            );

        });


        /* =======================================
           CONTRACT COPY
        ======================================== */

        contractText.textContent =
            CONTRACT_ADDRESS;


        async function copyContract() {

            const address =
                CONTRACT_ADDRESS;


            try {

                await navigator.clipboard.writeText(
                    address
                );

            } catch (error) {

                const temporary =
                    document.createElement("textarea");

                temporary.value =
                    address;

                temporary.style.position =
                    "fixed";

                temporary.style.opacity =
                    "0";

                document.body.appendChild(
                    temporary
                );

                temporary.focus();

                temporary.select();

                document.execCommand("copy");

                temporary.remove();

            }


            copyStatus.textContent =
                "COPIED!";


            setTimeout(() => {

                copyStatus.textContent =
                    "COPY";

            }, 1800);

        }


        contractButton.addEventListener(
            "click",
            copyContract
        );


        /* =======================================
           START WITH LORE 01
        ======================================== */

        showLore(0);

    </script>
